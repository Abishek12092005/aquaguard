# ===========================================================================
# AquaGuard AI — Render Blueprint
# ===========================================================================
# Declares the backend web service so a deploy is reproducible from the
# repository rather than clicked together in a dashboard.
#
#   * SINGLE-SERVICE MODE. This one service serves BOTH the Flask API and the
#     built React bundle: the build below compiles `frontend/dist` and copies it
#     to `backend/app/static`, and `app/__init__.py::_register_frontend` serves
#     it. One deploy, one URL, and NO CORS — the browser only ever talks to this
#     origin. The React app talks to `/api` relatively, which is why
#     `frontend/.env.production` must NOT carry an absolute onrender.com URL in
#     this mode.
#
#   * The split layout still works. If `backend/app/static` is absent — which is
#     what a Netlify-served frontend, local development and the test suite all
#     look like — the frontend routes are simply not registered and the API
#     behaves exactly as before. Reverting to Netlify needs no code change.
#
#   * Values under `envVars` with `sync: false` are SECRETS: Render prompts for
#     them on first deploy and stores them encrypted. They are deliberately NOT
#     committed here.
#   * DATABASE_URL is set in the dashboard (sync: false) and should be the
#     Aiven connection string exactly as the console gives it, e.g.
#       mysql://avnadmin:PASSWORD@mysql-XXXX.aivencloud.com:22266/defaultdb?ssl-mode=REQUIRED
#     The backend normalises the scheme and the ssl-mode parameter itself.
#
# Docs: https://render.com/docs/blueprint-spec
# ===========================================================================

services:
  - type: web
    name: aquaguard-api
    runtime: python
    plan: free
    # Build from the REPO ROOT, not backend/: the build needs to reach
    # frontend/ to compile the bundle. rootDir was `backend` when this service
    # was API-only; it cannot be, now that one service serves both.
    rootDir: .
    # 1. Backend deps.
    # 2. Frontend deps and the production build. `npm ci` needs the lockfile
    #    that `npm install` would rewrite, and NODE_VERSION is pinned below.
    # 3. Copy the compiled bundle where Flask serves it from. `rm -rf` first so
    #    a redeploy cannot serve a stale asset from the previous build.
    buildCommand: >-
      pip install -r backend/requirements.txt &&
      cd frontend && npm ci && npm run build &&
      rm -rf ../backend/app/static && cp -r dist ../backend/app/static
    # `cd backend` because wsgi.py and gunicorn.conf.py both live there.
    startCommand: cd backend && gunicorn -c gunicorn.conf.py --bind 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # --- Runtime ----------------------------------------------------------
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: NODE_VERSION
        value: "20"
      # Render terminates TLS in front of the service; keep this to Render's
      # internal addresses so X-Forwarded-* cannot be spoofed by a direct client.
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      - key: LOG_LEVEL
        value: INFO
      # --- Database (Aiven MySQL) -------------------------------------------
      # Full provider connection string. Paste it UNCHANGED; the app rewrites
      # `mysql://` to `mysql+pymysql://` and `ssl-mode=REQUIRED` to PyMySQL TLS.
      - key: DATABASE_URL
        sync: false
      # --- Secrets ----------------------------------------------------------
      # At least 32 chars each and DIFFERENT from one another. Generate with:
      #   python -c "import secrets; print(secrets.token_hex(32))"
      - key: SECRET_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      # --- CORS -------------------------------------------------------------
      # Exact browser origins allowed to call the API. No trailing slash, no
      # wildcard. The Netlify site origin belongs here (NOT the API URL).
      - key: CORS_ORIGINS
        value: https://aquaguard-water-ai.netlify.app
      # --- Aqua AI (providers) ----------------------------------------------
      # The assistant walks AQUA_AI_PROVIDER_ORDER and answers through the first
      # provider that is configured and reachable, falling through on a miss.
      # Gemini is first; Meta (served by Groq) is the fallback when Gemini's
      # quota is spent. Both need a KEY (sync: false, below) plus the MODEL and
      # URL declared here, because a provider with a key but no URL is skipped.
      - key: AQUA_AI_PROVIDER_ORDER
        value: gemini,meta
      - key: AQUA_AI_GEMINI_MODEL
        value: gemini-3.5-flash-lite
      # Meta publishes weights, not a hosted endpoint, so a BASE URL is REQUIRED.
      # This account is a Groq key, so it points at Groq's OpenAI-compatible API.
      - key: AQUA_AI_META_MODEL
        value: openai/gpt-oss-120b
      - key: AQUA_AI_META_BASE_URL
        value: https://api.groq.com/openai/v1
      # Keys are SECRETS: Render prompts for them on first deploy.
      - key: AQUA_AI_API_KEY
        sync: false
      - key: AQUA_AI_GEMINI_API_KEY
        sync: false
      - key: AQUA_AI_META_API_KEY
        sync: false
      - key: AQUA_AI_PROVIDER
        value: openai
      - key: AQUA_AI_MODEL
        value: gpt-4o-mini
      # --- Email (SMTP) -----------------------------------------------------
      # Non-secret transport settings live here; the credential does not.
      # MAIL_SUPPRESS_SEND=false is what actually turns sending on — with it
      # left true nothing leaves the server.
      - key: MAIL_ENABLED
        value: "true"
      - key: MAIL_SUPPRESS_SEND
        value: "false"
      - key: MAIL_HOST
        value: "smtp.gmail.com"
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USE_TLS
        value: "true"
      - key: MAIL_FROM_NAME
        value: AquaGuard
      - key: MAIL_DEFAULT_SENDER
        value: shekabi2005@gmail.com
      # The Gmail address and its APP PASSWORD are secrets.
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      # --- Admin console ----------------------------------------------------
      - key: ADMIN_ACCESS_PASSWORD
        sync: false
